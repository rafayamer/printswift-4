name: POS math tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check preview-order-math.js
      - run: node --test tests/preview-order-math.test.cjs
